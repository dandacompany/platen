<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Platen — 종이와 잉크</title>
    <meta
      name="description"
      content="밤 램프 아래 타자기로 쓰는 메모. 평범한 노트지만 입력 경험에 아날로그 감성을 더했다."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --lamp-x: 200px;
      }

      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #0b0b0a;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family:
          -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Malgun Gothic", sans-serif;
        overflow: hidden;
      }

      /* 책상 위의 한 장. 데스크탑 브라우저 기준으로 가운데 세로 기둥 하나를 쓴다. */
      .desk {
        position: relative;
        width: 100%;
        max-width: 860px;
        height: 100vh;
        background-color: #1c1b18;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.9);
        outline: none;
      }

      @media (min-width: 900px) {
        .desk {
          height: 94vh;
          border-radius: 18px;
          border: 1px solid #2a2824;
        }
      }

      /* ================= 1. 종이 & 타자기 영역 ================= */
      .paper-viewport {
        position: relative;
        flex: 1;
        width: 100%;
        background-color: #d2c9b6;
        overflow: hidden;
        cursor: text;
      }

      /* 빛바랜 편지지: 누렇게 바랜 바탕. 가장자리 어둠은 보이는 종이 테두리에 고정해
         타이핑으로 종이가 올라가도 늘 화면 가장자리에 남는다(잡티 위, 램프 조명 아래). */
      .paper-viewport[data-paper="letter"] {
        background-color: #e2cfa6;
      }
      .paper-viewport[data-paper="letter"]::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        box-shadow: inset 0 0 60px rgba(120, 80, 30, 0.35);
      }

      /* 종이 질감 노이즈 레이어 */
      .paper-texture {
        position: absolute;
        inset: 0;
        opacity: 0.36;
        pointer-events: none;
        z-index: 2;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.55'/%3E%3C/svg%3E");
      }

      /* 조명 위에 그리되 종이와 같은 transform 으로 움직여, 줄바꿈 때도 입력 위치에 붙어 있게 한다 */
      .type-impact-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 5;
        transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
      }

      /* 링과 입자를 담는 기준점. 입자가 링의 크기·투명도 변화를 물려받지 않게 분리한다 */
      .type-impact {
        position: absolute;
        width: 0;
        height: 0;
      }

      /* 종이 위 먹 색과 맞춘 잉크 링. 밝은 조명 아래에서도 보이도록 진하게 */
      .type-impact-ring {
        position: absolute;
        top: 0;
        left: 0;
        width: 18px;
        height: 18px;
        border: 2px solid rgba(30, 26, 21, 0.8);
        border-radius: 50%;
        transform: translate(-50%, -50%) scale(0.4);
        opacity: 1;
        animation: typeImpactPop 420ms cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
      }

      .type-impact-particle {
        position: absolute;
        top: 50%;
        left: 50%;
        width: var(--size);
        height: var(--size);
        border-radius: 50%;
        background: #1e1a15;
        transform: translate(-50%, -50%) rotate(var(--angle)) translateY(0)
          scale(1);
        animation: typeImpactParticle 420ms cubic-bezier(0.2, 0.8, 0.3, 1)
          forwards;
      }

      @keyframes typeImpactPop {
        0% {
          transform: translate(-50%, -50%) scale(0.4);
          opacity: 1;
        }
        100% {
          transform: translate(-50%, -50%) scale(2);
          opacity: 0;
        }
      }

      @keyframes typeImpactParticle {
        0% {
          transform: translate(-50%, -50%) rotate(var(--angle)) translateY(0)
            scale(1);
          opacity: 1;
        }
        60% {
          opacity: 1;
        }
        100% {
          transform: translate(-50%, -50%) rotate(var(--angle))
            translateY(var(--distance)) scale(0.5);
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .type-guide.strike {
          animation: none;
        }

        .type-impact {
          display: none;
        }

        .type-impact-ring {
          animation: none;
        }

        .type-impact-particle {
          animation: none;
        }
      }

      /* 실제 인쇄되는 종이 시트 */
      .paper-sheet {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        padding: 48px 76px 160px 84px;
        font-family: "Gowun Batang", "Nanum Myeongjo", serif;
        font-size: 18px;
        line-height: 30px;
        color: #1e1a15;
        letter-spacing: -0.01em;
        transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
        z-index: 1;
        white-space: pre-wrap;
        word-break: break-all;
      }

      /* 줄 공책: 한 줄 높이마다 가로줄을 그려 글자가 줄 위에 앉게 한다.
         --paper-line 은 잉크병 글자 크기와 함께 바뀐다. */
      /* 종이 바탕은 시트보다 화면 높이만큼 위로 더 그린다. 글이 짧아 시트가 아래로 내려와도
         위쪽 빈 곳까지 줄·섬유가 이어지고, 시트에 붙어 있어 타이핑할 때 함께 움직인다. */
      .paper-sheet.notebook::before,
      .paper-sheet.grid::before,
      .paper-sheet.hanji::before {
        content: "";
        position: absolute;
        top: -100vh;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: -1;
        pointer-events: none;
      }
      .paper-sheet.notebook::before {
        background-image: linear-gradient(
          to bottom,
          transparent calc(100% - 1px),
          rgba(74, 108, 150, 0.5) calc(100% - 1px)
        );
        background-size: 100% var(--paper-line, 30px);
        /* 늘린 높이(100vh)만큼 밀어, 줄이 시트 기준 48px 에서 시작하던 위치를 그대로 지킨다 */
        background-position: 0 calc(100vh + 48px);
      }

      /* 한지: 밝은 아이보리 바탕에 닥나무 섬유 가닥. 섬유는 종이에 붙어 글자와 함께 움직인다.
         섬유 그림은 가장자리가 이어지도록 그려 반복해도 이음매가 보이지 않는다. */

='M104 89Q125 96 147 98' stroke-opacity='0.34' stroke-width='1.0'/%3E%3Cpath d='M16 235Q-23 224 -53 252' stroke-opacity='0.46' stroke-width='0.8'/%3E%3Cpath d='M376 235Q337 224 307 252' stroke-opacity='0.46' stroke-width='0.8'/%3E%3Cpath d='M5 194Q13 213 28 226' stroke-opacity='0.38' stroke-width='0.7'/%3E%3Cpath d='M-22 159Q-13 186 13 195' stroke-opacity='0.38' stroke-width='1.0'/%3E%3Cpath d='M338 159Q347 186 373 195' stroke-opacity='0.38' stroke-width='1.0'/%3E%3C/g%3E%3C/svg%3E");
      }
      /* 모눈: 한 칸 = 글자 한 줄. 가로줄은 줄 공책과 같은 자리, 세로줄은 글자 시작 여백(84px)에서 시작한다. */
      .paper-sheet.grid::before {
        background-image:
          linear-gradient(to bottom, transparent calc(100% - 1px), rgba(74, 108, 150, 0.45) calc(100% - 1px)),
          linear-gradient(to right, rgba(74, 108, 150, 0.45) 1px, transparent 1px);
        background-size: var(--paper-line, 30px) var(--paper-line, 30px);
        background-position: 84px calc(100vh + 48px);
      }
      .paper-sheet.hanji::before {
        background-color: #e4dac3;
        background-image: var(--hanji-fibers);
        background-size: 360px 260px;
      }

      .ink-text {
        text-shadow: 0 0 0.6px rgba(25, 20, 15, 0.55);
      }

      .composing-char {
        text-shadow: 0 0 0.9px rgba(0, 0, 0, 0.85);
      }

      #cursorAnchor {
        display: inline-block;
        width: 2px;
        height: 20px;
        vertical-align: text-bottom;
      }

      /* 나이트 램프 어둠 & 콘 라이트 오버레이 */
      .lighting-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 4;
      }

      /* 상단 HUD (리셋 / 제목 / 자동타이핑 토글 / 글자수 카운터) */
      .top-hud {
        position: absolute;
        top: 20px;
        left: 22px;
        right: 22px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 10;
      }

      .hud-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .hud-btn {
        background: none;
        border: none;
        color: rgba(175, 166, 148, 0.7);
        font-size: 20px;
        cursor: pointer;
        padding: 4px 8px;
        transition: color 0.2s;
      }
      .hud-btn:hover {
        color: rgba(240, 228, 205, 1);
      }

      .wordmark {
        font-family: "Courier Prime", monospace;
        font-size: 13px;
        letter-spacing: 0.18em;
        color: rgba(175, 166, 148, 0.55);
        text-transform: uppercase;
      }

      .hud-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .demo-badge {
        font-size: 12px;
        padding: 4px 11px;
        border-radius: 14px;
        background: rgba(212, 162, 89, 0.2);
        border: 1px solid rgba(212, 162, 89, 0.5);
        color: #ecc482;
        cursor: pointer;
        font-weight: 500;
      }
      .demo-badge:hover {
        background: rgba(212, 162, 89, 0.32);
      }

      .char-counter {
        font-family: "Courier Prime", monospace;
        font-size: 13px;
        color: rgba(175, 166, 148, 0.7);
        letter-spacing: -0.02em;
      }

      /* 타자기 T자 활자 가이드 */
      .type-guide-container {
        position: absolute;
        left: 0;
        bottom: 6px;
        width: 100%;
        height: 34px;
        pointer-events: none;
        z-index: 6;
      }

      .type-guide {
        position: absolute;
        bottom: 0;
        left: var(--lamp-x);
        transform: translateX(-50%);
        width: 24px;
        height: 25px;
        transition: left 0.055s cubic-bezier(0.2, 0.9, 0.3, 1);
      }

      .type-guide::before {
        content: "";
        position: absolute;
        top: 1px;
        left: 2px;
        right: 2px;

    <script>
      /* =========================================================================
   1. 사운드 합성 엔진 (Web Audio API)
   ========================================================================= */
      class TypewriterAudio {
        constructor() {
          this.ctx = null;
        }

        init() {
          try {
            if (!this.ctx) {
              const AudioCtx = window.AudioContext || window.webkitAudioContext;
              if (AudioCtx) this.ctx = new AudioCtx();
            }
            if (this.ctx && this.ctx.state === "suspended") {
              this.ctx.resume();
            }
          } catch (e) {}
        }

        playKeyClick(isSpace = false) {
          try {
            this.init();
            if (!this.ctx) return;
            const now = this.ctx.currentTime;

            const bufferSize = Math.floor(
              this.ctx.sampleRate * (isSpace ? 0.055 : 0.04),
            );
            const buffer = this.ctx.createBuffer(
              1,
              bufferSize,
              this.ctx.sampleRate,
            );
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
              data[i] =
                (Math.random() * 2 - 1) *
                Math.exp(-i / (this.ctx.sampleRate * 0.008));
            }

            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;

            const filter = this.ctx.createBiquadFilter();
            filter.type = "bandpass";
            filter.frequency.setValueAtTime(
              isSpace ? 900 : 1750 + (Math.random() * 350 - 175),
              now,
            );
            filter.Q.setValueAtTime(2.2, now);

            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(isSpace ? 0.45 : 0.65, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.038);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(this.ctx.destination);
            noise.start(now);

            const osc = this.ctx.createOscillator();
            const oscGain = this.ctx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(isSpace ? 140 : 240, now);
            osc.frequency.exponentialRampToValueAtTime(55, now + 0.035);

            oscGain.gain.setValueAtTime(0.25, now);
            oscGain.gain.exponentialRampToValueAtTime(0.005, now + 0.035);

            osc.connect(oscGain);
            oscGain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.038);
          } catch (e) {}
        }

        playReturnBell() {
          try {
            this.init();
            if (!this.ctx) return;
            const now = this.ctx.currentTime;

            [2150, 4300, 6100].forEach((freq, idx) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = "sine";
              osc.frequency.setValueAtTime(freq, now);

              const amp = idx === 0 ? 0.22 : idx === 1 ? 0.09 : 0.04;
              gain.gain.setValueAtTime(amp, now);
              gain.gain.exponentialRampToValueAtTime(
                0.0008,
                now + (idx === 0 ? 0.65 : 0.3),
              );

              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start(now);
              osc.stop(now + 0.7);
            });
          } catch (e) {}
        }
      }

      const COMBINE_JUNG = {
        ㅗㅏ: "ㅘ",
        ㅗㅐ: "ㅙ",
        ㅗㅣ: "ㅚ",
        ㅜㅓ: "ㅝ",
        ㅜㅔ: "ㅞ",

      const COMBINE_JONG = {
        ㄱㅅ: "ㄳ",
        ㄴㅈ: "ㄵ",
        ㄴㅎ: "ㄶ",
        ㄹㄱ: "ㄺ",
        ㄹㅁ: "ㄻ",
        ㄹㅂ: "ㄼ",
        ㄹㅅ: "ㄽ",

        ㄹㅍ: "ㄿ",
        ㄹㅎ: "ㅀ",
        ㅂㅅ: "ㅄ",
      };

      const SPLIT_JONG = {
        ㄳ: ["ㄱ", "ㅅ"],
        ㄵ: ["ㄴ", "ㅈ"],
        ㄶ: ["ㄴ", "ㅎ"],
        ㄺ: ["ㄹ", "ㄱ"],
        ㄻ: ["ㄹ", "ㅁ"],
        ㄼ: ["ㄹ", "ㅂ"],
        ㄽ: ["ㄹ", "ㅅ"],
        ㄾ: ["ㄹ", "ㅌ"],
        ㄿ: ["ㄹ", "ㅍ"],
        ㅀ: ["ㄹ", "ㅎ"],
        ㅄ: ["ㅂ", "ㅅ"],
      };

      function makeHangulSyllable(cho, jung, jong = "") {
        const cIdx = CHO.indexOf(cho);
        const vIdx = JUNG.indexOf(jung);
        const tIdx = JONG.indexOf(jong);
        if (cIdx < 0 || vIdx < 0 || tIdx < 0) return cho + jung + jong;
        return String.fromCharCode(0xac00 + (cIdx * 21 + vIdx) * 28 + tIdx);
      }

      class HangulAutomata {
        constructor() {
          this.reset();
        }

        reset() {
          this.cho = "";
          this.jung = "";
          this.jong = "";
        }

        getComposingChar() {
          if (this.cho && this.jung) {
            return makeHangulSyllable(this.cho, this.jung, this.jong);
          }
          return this.cho || this.jung || "";
        }

        inputJamo(ch) {
          let committed = "";
          const isConsonant = CHO.includes(ch);
          const isVowel = JUNG.includes(ch);

          if (!isConsonant && !isVowel) {
            committed = this.flush() + ch;
            return { committed, composing: "" };
          }

          if (isConsonant) {
            if (!this.cho && !this.jung) {
              this.cho = ch;
            } else if (this.cho && !this.jung) {
              committed = this.cho;
              this.cho = ch;
            } else if (this.cho && this.jung && !this.jong) {
              if (JONG.includes(ch)) {
                this.jong = ch;
              } else {
                committed = this.getComposingChar();
                this.reset();
                this.cho = ch;
              }
            } else if (this.cho && this.jung && this.jong) {
              const comb = COMBINE_JONG[this.jong + ch];
              if (comb) {
                this.jong = comb;
              } else {
                committed = this.getComposingChar();
                this.reset();
                this.cho = ch;
              }
            }
          } else if (isVowel) {
            if (!this.cho && !this.jung) {
              this.jung = ch;
            } else if (!this.cho && this.jung) {
              const comb = COMBINE_JUNG[this.jung + ch];
              if (comb) {
                this.jung = comb;
              } else {
                committed = this.jung;
                this.jung = ch;
              }
            } else if (this.cho && !this.jung) {
              this.jung = ch;
            } else if (this.cho && this.jung && !this.jong) {
              const comb = COMBINE_JUNG[this.jung + ch];
              if (comb) {
                this.jung = comb;
              } else {
                committed = this.getComposingChar();
                this.reset();
                this.jung = ch;
              }
            } else if (this.cho && this.jung && this.jong) {
              if (SPLIT_JONG[this.jong]) {
                const [firstJong, secondJong] = SPLIT_JONG[this.jong];
                this.jong = firstJong;
                committed = this.getComposingChar();
                this.reset();
                this.cho = secondJong;
                this.jung = ch;
              } else {
                const nextCho = this.jong;
                this.jong = "";
                committed = this.getComposingChar();
                this.reset();
                this.cho = nextCho;
                this.jung = ch;
              }
            }
          }

          return { committed, composing: this.getComposingChar() };
        }

        backspace() {
          if (this.jong) {
            if (SPLIT_JONG[this.jong]) {
              this.jong = SPLIT_JONG[this.jong][0];
            } else {
              this.jong = "";
            }
            return true;
          }
          if (this.jung) {
            const entries = Object.entries(COMBINE_JUNG);
            const found = entries.find(([, val]) => val === this.jung);
            if (found) {
              this.jung = found[0][0];
            } else {
              this.jung = "";
            }
            return true;
          }
          if (this.cho) {
            this.cho = "";
            return true;
          }
          return false;
        }

        flush() {
          const c = this.getComposingChar();
          this.reset();
          return c;
        }
      }

      /* =========================================================================
   4. 화면 상태

      const automata = new HangulAutomata();
      let committedStr = INITIAL_TEXT;

      const desk = document.getElementById("desk");
      const committedEl = document.getElementById("committedText");
      const composingEl = document.getElementById("composingText");
      const cursorAnchor = document.getElementById("cursorAnchor");
      const paperSheet = document.getElementById("paperSheet");
      const paperViewport = document.getElementById("paperViewport");
      const typeGuide = document.getElementById("typeGuide");
      const typeImpactLayer = document.getElementById("typeImpactLayer");
      const impactToggle = document.getElementById("impactToggle");
      const charCountEl = document.getElementById("charCount");
      const lineCountEl = document.getElementById("lineCount");
      const reducedMotionQuery = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      );

      // T자 활자 타격 애니메이션
      function triggerStrike() {
        if (reducedMotionQuery.matches) return;
        typeGuide.classList.remove("strike");
        void typeGuide.offsetWidth;
        typeGuide.classList.add("strike");
      }

      // 입력 위치에서 작게 퍼지는 잉크 임팩트. 모션 감소 설정에서는 생성하지 않는다.
      function triggerTypeImpact() {
        if (reducedMotionQuery.matches || !impactToggle.checked) return;

        // 키마다 바로 측정해야 한 프레임 안의 연타도 각자 자리에 찍힌다.
        // 레이어는 종이와 같은 transform 을 따르므로 이동 중이어도 두 사각형의 차이는 종이 기준 좌표다.
        const targetNode = automata.getComposingChar()
          ? composingEl
          : cursorAnchor;
        const targetRect = targetNode.getBoundingClientRect();
        const layerRect = typeImpactLayer.getBoundingClientRect();
        const impact = document.createElement("span");

        impact.className = "type-impact";
        impact.style.left = `${targetRect.left - layerRect.left + targetRect.width / 2}px`;
        impact.style.top = `${targetRect.top - layerRect.top + targetRect.height / 2}px`;

        const ring = document.createElement("span");
        ring.className = "type-impact-ring";
        impact.appendChild(ring);

        for (let index = 0; index < 4; index += 1) {
          const particle = document.createElement("span");
          particle.className = "type-impact-particle";
          particle.style.setProperty(
            "--angle",
            `${index * 90 + (Math.random() * 20 - 10)}deg`,
          );
          particle.style.setProperty(
            "--distance",
            `${18 + Math.random() * 12}px`,
          );
          particle.style.setProperty("--size", `${4.5 + Math.random() * 3}px`);
          impact.appendChild(particle);
        }

        const cleanupImpact = () => impact.remove();
        ring.addEventListener("animationend", cleanupImpact, { once: true });
        ring.addEventListener("animationcancel", cleanupImpact, {
          once: true,
        });
        typeImpactLayer.appendChild(impact);
      }

      const clearTypeImpacts = () => {
        while (typeImpactLayer.firstChild) typeImpactLayer.firstChild.remove();
      };
      impactToggle.addEventListener("change", () => {
        if (!impactToggle.checked) clearTypeImpacts();
      });
      const handleReducedMotionChange = (event) => {
        if (event.matches) clearTypeImpacts();
      };
      if (reducedMotionQuery.addEventListener) {
        reducedMotionQuery.addEventListener("change", handleReducedMotionChange);
      } else {
        reducedMotionQuery.addListener(handleReducedMotionChange);
      }

      // 화면 텍스트, T자 가이드와 램프 좌표, 종이 스크롤 갱신
      function updateScreen() {
        const comp = automata.getComposingChar();
        committedEl.textContent = committedStr;
        composingEl.textContent = comp;

        const totalLen = committedStr.length + (comp ? 1 : 0);
        charCountEl.textContent = totalLen.toLocaleString();
        lineCountEl.textContent = (committedStr + comp).split("\n").length;

        requestAnimationFrame(() => {
          const viewportRect = paperViewport.getBoundingClientRect();
          if (!viewportRect.height) return;

          // 조합 중이면 조합 글자의 중심, 아니면 커서 앵커를 기준으로 T자 가이드와 램프를 둔다
          const targetNode = comp ? composingEl : cursorAnchor;
          const targetRect = targetNode.getBoundingClientRect();

          const relX =
            targetRect.left -
            viewportRect.left +
            (comp ? targetRect.width / 2 : 4);
          const clampedX = Math.max(
            70,
            Math.min(viewportRect.width - 70, relX),
          );
          document.documentElement.style.setProperty(
            "--lamp-x",
            `${clampedX}px`,
          );

          // 현재 줄이 항상 타자기 인쇄선(하단 T자 바로 위)에 오도록 종이를 민다
          const anchorOffsetTop = cursorAnchor.offsetTop;
          const targetPrintLineY = viewportRect.height - 66;
          const translateY = targetPrintLineY - anchorOffsetTop;
          paperSheet.style.transform = `translateY(${translateY}px)`;
          typeImpactLayer.style.transform = paperSheet.style.transform;

          updateLightingOverlay(clampedX, viewportRect.height);
        });
      }

      const fontSelect = document.getElementById("fontSelect");
      fontSelect.addEventListener("change", () => {
        paperSheet.style.fontFamily = `"${fontSelect.value}", serif`;
        updateScreen();
      });
      // 웹폰트가 늦게 도착해도 인쇄선과 램프 위치를 다시 맞춘다.
      document.fonts.ready.then(() => updateScreen());
      document.fonts.addEventListener("loadingdone", () => updateScreen());

      // 키 하나 처리. 자모, 문장부호, 'BACK', ' ', 'Enter'
      function handleKey(k) {
        if (k === "BACK") {
          sound.playKeyClick(false);
          triggerStrike();
          if (!automata.backspace()) {
            committedStr = committedStr.slice(0, -1);
          }
          updateScreen();
          return;
        }

        if (k === " ") {
          sound.playKeyClick(true);
          triggerStrike();
          committedStr += automata.flush() + " ";
          updateScreen();
          return;
        }

        if (k === "Enter") {
          sound.playReturnBell();
          triggerStrike();
          committedStr += automata.flush() + "\n";
          updateScreen();
          return;
        }

        sound.playKeyClick(false);
        triggerStrike();

        const res = automata.inputJamo(k);
        if (res.committed) {
          committedStr += res.committed;
        }
        updateScreen();
        triggerTypeImpact();
      }

      /* =========================================================================
   5. 나이트 램프(조명 초점 / 확산 / 거리) 효과

      const lightingLayer = document.getElementById("lightingLayer");
      const focusSlider = document.getElementById("focusSlider");

      let isLampOn = true;

      function updateLightingOverlay(lampX, viewportH) {
        const x =
          lampX ||
          parseFloat(
            getComputedStyle(document.documentElement).getPropertyValue(
              "--lamp-x",
            ),
          ) ||
          200;
        const y = (viewportH || paperViewport.clientHeight) + 6;

        if (!isLampOn) {
          lightingLayer.style.background = `rgba(10, 10, 9, 0.88)`;
          return;
        }

        const focus = parseFloat(focusSlider.value);
        const spread = parseFloat(spreadSlider.value);
        const dist = parseFloat(distSlider.value);

        spreadLabel.textContent = `확산 ${Math.round(spread)}°`;
        distLabel.textContent = `거리 ${Math.round(dist)}%`;

        const radiusX = spread * 2.6;
        const radiusY = dist * 4.2;
        const coreStop = Math.max(8, (105 - focus) * 0.35);
        const midStop = Math.min(78, coreStop + (115 - focus) * 0.55);

        lightingLayer.style.background = `
    radial-gradient(
      ellipse ${radiusX}px ${radiusY}px at ${x}px ${y}px,
      rgba(255, 232, 175, 0.28) 0%,
      rgba(255, 214, 140, 0.12) ${coreStop}%,
      rgba(22, 20, 17, 0.48) ${midStop}%,
      rgba(14, 13, 11, 0.78) 100%
    )
  `;
      }

      [focusSlider, spreadSlider, distSlider].forEach((slider) => {
        slider.addEventListener("input", () => updateLightingOverlay());
        // 슬라이더를 만진 뒤에도 키보드 입력이 종이로 가도록 포커스를 돌려준다

        updateLightingOverlay();
        desk.focus();
      });

      // 잉크병 컨트롤은 글 내용과 한글 조합 상태를 바꾸지 않는다.

      // 종이 양식: 겉모습만 바꾸고 글 내용과 조합 상태는 건드리지 않는다.
      const PAPER_NAMES = { plain: "민무늬", notebook: "줄 공책", grid: "모눈", hanji: "한지", letter: "편지지" };
      const paperToggleBtn = document.getElementById("paperToggleBtn");
      const paperToggleSwatch = document.getElementById("paperToggleSwatch");
      const paperStylePanel = document.getElementById("paperStylePanel");
      const paperOptions = paperStylePanel.querySelectorAll(".paper-option");

      function setPaperPanelOpen(open) {

      function setPaper(kind) {
        // 민무늬는 클래스 없이, 나머지 종이는 이름과 같은 클래스를 하나만 붙인다.

        paperViewport.dataset.paper = kind;
        paperToggleSwatch.dataset.paper = kind;
        paperToggleBtn.setAttribute("aria-label", `종이 양식 고르기 (지금: ${PAPER_NAMES[kind]})`);
        paperOptions.forEach((opt) => {
          opt.setAttribute("aria-pressed", String(opt.dataset.paper === kind));
        });
      }
      paperToggleBtn.addEventListener("click", () => {
        setInkPanelOpen(false);
        const opening = paperStylePanel.hidden;
        setPaperPanelOpen(opening);
        if (opening) paperStylePanel.querySelector('[aria-pressed="true"]').focus();
      });
      paperOptions.forEach((opt) => {
        opt.addEventListener("click", () => {
          setPaper(opt.dataset.paper);
          setPaperPanelOpen(false);
          desk.focus();
        });
      });
      inkStation.addEventListener("keydown", (e) => {
        // 스페이스/Enter/방향키를 종이 입력 대신 네이티브 컨트롤에 전달한다.
        e.stopPropagation();
        if (e.key === "Escape") {
          e.preventDefault();
          if (!paperStylePanel.hidden) {
            setPaperPanelOpen(false);
            paperToggleBtn.focus();
            return;
          }
          setInkPanelOpen(false);
          inkBottleBtn.focus();
        }
      });

      /* =========================================================================
   6. 물리 키보드 연동 - 한/영 상태와 무관하게 자판 위치(e.code)로 자모를 정한다
   ========================================================================= */
      const CODE_TO_JAMO = {
        KeyQ: ["ㅂ", "ㅃ"],
        KeyW: ["ㅈ", "ㅉ"],
        KeyE: ["ㄷ", "ㄸ"],
        KeyR: ["ㄱ", "ㄲ"],
        KeyT: ["ㅅ", "ㅆ"],
        KeyY: ["ㅛ", "ㅛ"],
        KeyU: ["ㅕ", "ㅕ"],
        KeyI: ["ㅑ", "ㅑ"],
        KeyO: ["ㅐ", "ㅒ"],
        KeyP: ["ㅔ", "ㅖ"],
        KeyA: ["ㅁ", "ㅁ"],
        KeyS: ["ㄴ", "ㄴ"],
        KeyD: ["ㅇ", "ㅇ"],
        KeyF: ["ㄹ", "ㄹ"],
        KeyG: ["ㅎ", "ㅎ"],
        KeyH: ["ㅗ", "ㅗ"],
        KeyJ: ["ㅓ", "ㅓ"],
        KeyK: ["ㅏ", "ㅏ"],
        KeyL: ["ㅣ", "ㅣ"],
        KeyZ: ["ㅋ", "ㅋ"],
        KeyX: ["ㅌ", "ㅌ"],
        KeyC: ["ㅊ", "ㅊ"],
        KeyV: ["ㅍ", "ㅍ"],
        KeyB: ["ㅠ", "ㅠ"],
        KeyN: ["ㅜ", "ㅜ"],
        KeyM: ["ㅡ", "ㅡ"],
      };

      window.addEventListener("keydown", (e) => {
        // 글꼴 메뉴의 방향키·Enter·문자 탐색은 종이에 입력하지 않는다.
        if (e.target === fontSelect || e.target === impactToggle) return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;

        // Shift·CapsLock·한/영 키 단독 입력은 무시. IME 가 'Process' 로 보내도 e.code 는 살아 있으므로 아래에서 처리한다
        if (e.key === "Shift" || e.key === "CapsLock" || e.key === "HangulMode")
          return;

        stopDemo();

        if (e.code === "Backspace" || e.key === "Backspace") {
          e.preventDefault();
          handleKey("BACK");
          return;
        }

        if (e.code === "Enter" || e.key === "Enter") {
          e.preventDefault();
          handleKey("Enter");
          return;
        }

        if (e.code === "Space" || e.key === " ") {
          e.preventDefault();
          handleKey(" ");
          return;
        }

        // 알파벳 자판 위치(KeyA ~ KeyZ)는 한/영 상태와 무관하게 두벌식 한글 자모로
        if (CODE_TO_JAMO[e.code]) {
          e.preventDefault();
          const jamo = e.shiftKey
            ? CODE_TO_JAMO[e.code][1]
            : CODE_TO_JAMO[e.code][0];
          handleKey(jamo);
          return;
        }

        // 숫자와 문장부호
        if (e.key && e.key.length === 1 && e.key !== "Process") {
          e.preventDefault();
          handleKey(e.key);
        }
      });

      /* =========================================================================
   7. 자동 타이핑 데모
   ========================================================================= */
      let demoTimer = null;
      let demoIdx = 0;
      let isDemoRunning = true;
      const demoToggleBtn = document.getElementById("demoToggleBtn");

      function stepDemo() {
        if (!isDemoRunning) return;
        if (demoIdx >= DEMO_SEQUENCE.length) {
          stopDemo();
          demoToggleBtn.textContent = "다시 재생 ↻";
          return;
        }

        const key = DEMO_SEQUENCE[demoIdx++];
        handleKey(key);

        let delay = 145 + Math.random() * 70;
        if (key === "Enter") delay = 420;
        else if (key === " ") delay = 200;

        demoTimer = setTimeout(stepDemo, delay);
      }

      function stopDemo() {
        if (!isDemoRunning) return;
        isDemoRunning = false;
        if (demoTimer) clearTimeout(demoTimer);
        demoToggleBtn.textContent = "자동 타이핑 ▶";
      }

      function startDemo(resetText = false) {
        if (resetText) {
          clearTypeImpacts();
          automata.reset();
          committedStr = INITIAL_TEXT;
          demoIdx = 0;
          updateScreen();
        }
        isDemoRunning = true;
        demoToggleBtn.textContent = "자동 타이핑 중 ⏸";
        if (demoTimer) clearTimeout(demoTimer);
        demoTimer = setTimeout(stepDemo, 450);
      }

      demoToggleBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        sound.init();
        if (isDemoRunning) {
          stopDemo();
        } else {
          const needReset = demoIdx >= DEMO_SEQUENCE.length;
          startDemo(needReset);
        }
        desk.focus();
      });

      document.getElementById("clearBtn").addEventListener("click", () => {
        sound.init();
        stopDemo();
        startDemo(true);
        desk.focus();
      });

      // 종이를 클릭하면 데모를 멈추고 바로 타이핑할 수 있게 포커스를 준다
      paperViewport.addEventListener("click", () => {
        sound.init();
        stopDemo();
        desk.focus();
      });

      document.body.addEventListener("mousedown", () => sound.init(), {
        once: true,
      });
      window.addEventListener("resize", () => updateScreen());

      // 초기 실행
      updateScreen();
      desk.focus();
      startDemo(false);
    </script>
  </body>
</html>
